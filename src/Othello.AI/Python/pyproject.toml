[tool.ruff]
# Python 3.8 以上（stdlib のみ）が本プロジェクトの対象環境（CLAUDE.md 参照）。
# Rust 拡張の abi3-py38 バインディングとも合わせている。
target-version = "py38"
# 既存コードが暗黙のデフォルト（88）に沿っていたため、その値をそのまま明示する。
line-length = 88

[tool.ruff.lint]
# Ruff の「デフォルトルール」はバージョンによって変わりうる（Issue #124: Ruff 0.16.0 への
# アップデートでデフォルト有効ルールが変わりCIが壊れた事故が実際に発生した）。
# select を明示することで、Ruff をアップデートしても有効ルールセットが勝手に変わらないようにする。
#
# ここでの E4/E7/E9/F は、設定ファイル新設時点（Issue #124 対応時）で実際に有効だった
# ルールセットをそのまま明示固定したもの（`ruff check --select RUF100 --isolated` で
# 過去バージョン向けの noqa コメント（BLE001/B017/F401）がいずれも「非有効ルール」と
# 判定されたことから、ゼロ設定時の実効ルールが E4/E7/E9/F のみであることを実測で確認した）。
# ルールセットを拡張する場合は、既存コードへの影響を確認した上で select に追記すること。
select = ["E4", "E7", "E9", "F"]
